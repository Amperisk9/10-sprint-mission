services:
  backend:
    build: ./app
    container_name: Backend
    environment:
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
  nginx:
    image: nginx
    container_name: Nginx
    ports:
      - "3000:8080"
    depends_on: [backend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/html:/usr/share/nginx/html

