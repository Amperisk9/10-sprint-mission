spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  application:
    name: discodeit
  sql.init.mode: always
  jpa:
    hibernate:
      ddl-auto: none

discodeit:
  repository:
    type: file
    file-directory: .discodeit
  upload:
    profile: ${discodeit.repository.file-directory}/upload/profile
    attachment: ${discodeit.repository.file-directory}/upload/attachment

logging.level:
  org.hibernate.SQL: debug                # SQL 실행
  org.hibernate.orm.jdbc.bind: trace      # 파라미터 설정(DB에 보내는 값)
  org.hibernate.orm.jdbc.extract: trace   # 결과 읽기(DB에서 받아온 값)